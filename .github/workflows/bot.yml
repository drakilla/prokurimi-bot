name: ProkurimiBot

on:
  schedule:
    - cron: "*/10 * * * *"   # çdo 10 minuta (GitHub ndonjëherë vonohet disa minuta)
  workflow_dispatch:          # butoni "Run workflow" për ta ndezur me dorë

permissions:
  contents: write             # që të ruajë state.json pas çdo kontrolli

concurrency:
  group: prokurimi-bot
  cancel-in-progress: false

jobs:
  kontrolli:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontrollo e-Prokurimin dhe grantet
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Belgrade
        run: python prokurimi_bot.py

      - name: Ruaj gjendjen
        if: always()
        run: |
          git config user.name "prokurimi-bot"
          git config user.email "prokurimi-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "gjendja $(date +'%d.%m %H:%M')" && git pull --rebase && git push)
